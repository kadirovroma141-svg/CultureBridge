{% extends "base.html" %}
{% block title %}{{ code }} — {{ name }} | CultureBridge AI{% endblock %}
{% block head %}
<link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">
<link rel="stylesheet" href="{{ url_for('static', filename='css/pages.css') }}">
{% endblock %}
{% block body_class %}page-error{% endblock %}
{% block body %}
<div class="bg-orbs" aria-hidden="true"><span></span><span></span><span></span></div>
<div class="bg-grid" aria-hidden="true"></div>
<main class="error-page">
  <div class="card error-card">
    <span class="error-code">{{ code }}</span>
    <h1>{{ name }}</h1>
    <p class="muted">{{ description }}</p>
    <div class="error-actions">
      <a href="{{ url_for('web.home') }}" class="btn primary">← Go Home</a>
      <a href="javascript:history.back()" class="btn ghost">Go Back</a>
    </div>
  </div>
</main>
{% endblock %}
